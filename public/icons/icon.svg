<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular halo -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="12 12"/>
  
  <!-- Urja Energy Sun Rays -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-opacity="0.2"/>

  <!-- Energy Lightning Bolt & Saathi Leaf -->
  <g filter="url(#shadow)">
    <!-- Main Lightning Bolt -->
    <path d="M280 64 L160 272 H264 L232 448 L352 240 H248 Z" fill="url(#boltGrad)"/>
    
    <!-- Accent Green Leaf / Energy Curve -->
    <path d="M248 240 C280 200 340 180 376 196 C376 240 336 290 280 304 Z" fill="#10b981" fill-opacity="0.85"/>
  </g>

  <!-- Community Saathi Indicator Dot -->
  <circle cx="360" cy="180" r="16" fill="#38bdf8"/>
</svg>

